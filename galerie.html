<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Istanbul · Ma galerie</title>
  <meta name="description" content="Toutes les photos du voyage à Istanbul, rangées par quartier et par jour.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Sans+3:wght@400;600;700;800&display=swap">
  <style>
    :root { --ink: #14241d; --deep: #2e6b57; --paper: #fbf7ef; --sand: #f3ead8; --line: rgba(20,36,29,.12); --muted: #55665d; --gold: #d4a24c;
      --display: "DM Serif Display", Georgia, serif; --body: "Source Sans 3", -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left)); }
    .nav { position: sticky; top: 0; z-index: 20; background: rgba(46,107,87,.97); color: #fff; }
    .nav .wrap { display: flex; align-items: center; gap: 14px; height: 54px; }
    .nav b { font-family: var(--display); font-weight: 400; font-size: 19px; margin-right: auto; }
    .nav a { color: #fff; text-decoration: none; font-weight: 700; font-size: 13px; opacity: .9; white-space: nowrap; }
    .nav a.gold { background: var(--gold); color: var(--ink); padding: 6px 12px; border-radius: 999px; opacity: 1; }
    h1 { font-family: var(--display); font-weight: 400; font-size: clamp(32px, 6vw, 52px); line-height: 1.05; margin: 26px 0 6px; }
    .lead { color: var(--muted); margin: 0 0 18px; max-width: 720px; }
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button { flex: none; border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 9px 15px; font: 700 14px var(--body); color: var(--ink); cursor: pointer; }
    .tabs button.on { background: var(--deep); border-color: var(--deep); color: #fff; }
    .tabs small { opacity: .75; font-weight: 600; margin-left: 4px; }
    section.grp { margin: 22px 0 30px; }
    .grp h2 { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0 0 12px; }
    .grp h2 .num { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--c, var(--deep)); color: #fff; font: 800 14px var(--body); flex: none; }
    .grp h2 small { font: 700 13px var(--body); color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    @media (max-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 4px; } .grid button img { border-radius: 6px; } }
    .grid button { border: 0; padding: 0; background: none; cursor: zoom-in; position: relative; }
    .grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; display: block; background: var(--sand); }
    .empty { background: #fff; border: 1px dashed var(--line); border-radius: 18px; padding: 22px; color: var(--muted); }
    .empty a { color: var(--deep); font-weight: 700; }
    /* Visionneuse plein écran */
    .viewer { position: fixed; inset: 0; z-index: 100; background: #0d1512; display: none; flex-direction: column; color: #fff; touch-action: pan-y; }
    .viewer.open { display: flex; }
    .viewer .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: max(12px, env(safe-area-inset-top)) 14px 10px; }
    .viewer .cap { font-size: 14px; line-height: 1.3; }
    .viewer .cap b { display: block; font-size: 16px; }
    .viewer .close { border: 0; background: #ffffff26; color: #fff; width: 44px; height: 44px; border-radius: 50%; font-size: 22px; cursor: pointer; flex: none; }
    .viewer .stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 0 8px; }
    .viewer .stage img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
    .viewer .arrow { position: absolute; top: 50%; transform: translateY(-50%); border: 0; background: #ffffff26; color: #fff; width: 48px; height: 48px; border-radius: 50%; font-size: 26px; cursor: pointer; }
    .viewer .prev { left: 10px; } .viewer .next { right: 10px; }
    .viewer .count { text-align: center; padding: 10px 0 max(14px, env(safe-area-inset-bottom)); font-size: 13px; opacity: .8; }
  </style>
</head>
<body>
  <nav class="nav"><div class="wrap"><b>Ma galerie</b><a href="guide.html">Le guide</a><a class="gold" href="./">La carte</a></div></nav>
  <main class="wrap">
    <h1>Ma galerie</h1>
    <p class="lead">Toutes les photos du voyage, rangées par quartier ou par jour. Touchez une photo pour l’agrandir, puis glissez pour passer à la suivante.</p>
    <div class="tabs" id="tabs"></div>
    <div id="gallery"></div>
  </main>
  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Photo en grand">
    <div class="top"><div class="cap" id="cap"></div><button class="close" id="close" aria-label="Fermer">×</button></div>
    <div class="stage" id="stage"><img id="big" alt=""></div>
    <button class="arrow prev" id="prev" aria-label="Photo précédente">‹</button>
    <button class="arrow next" id="next" aria-label="Photo suivante">›</button>
    <div class="count" id="count"></div>
  </div>
  <script src="data.js?v=10271938"></script>
  <script>
  (() => {
    const COLORS = ["#b2452c", "#b2452c", "#b2452c", "#b2452c", "#b2452c", "#2f6f9f", "#2f6f9f", "#7b4fa0", "#7b4fa0", "#1f7a72", "#1f7a72", "#1f7a72", "#c07a12", "#c07a12"];
    const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
    const dayLabel = k => new Date(k + "T12:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
    const timeLabel = t => new Date(t).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    let photos = [], mode = "quartier", list = [], idx = 0;

    function load() {
      return new Promise(resolve => {
        if (!("indexedDB" in window)) return resolve([]);
        const req = indexedDB.open("guide-istanbul-photos", 2);
        req.onupgradeneeded = e => {
          const db = req.result;
          if (e.oldVersion < 1) db.createObjectStore("photos", { keyPath: "id", autoIncrement: true }).createIndex("district", "district");
          if (e.oldVersion < 2) { db.createObjectStore("tracks", { keyPath: "id", autoIncrement: true }); db.createObjectStore("notes", { keyPath: "day" }); }
        };
        req.onerror = () => resolve([]);
        req.onsuccess = () => {
          try {
            const all = req.result.transaction("photos").objectStore("photos").getAll();
            all.onsuccess = () => resolve(all.result || []);
            all.onerror = () => resolve([]);
          } catch (e) { resolve([]); }
        };
      });
    }

    function groups() {
      if (mode === "jour") {
        const days = [...new Set(photos.map(p => dayKey(p.t)))].sort();
        return days.map((k, i) => ({ title: `Jour ${i + 1} · ${dayLabel(k)}`, num: i + 1, color: "var(--deep)", items: photos.filter(p => dayKey(p.t) === k) }));
      }
      const out = districts.map((d, i) => ({ title: d.name, num: i + 1, color: COLORS[i], items: photos.filter(p => p.district === d.id) })).filter(g => g.items.length);
      const loose = photos.filter(p => !p.district || !districts.some(d => d.id === p.district));
      if (loose.length) out.push({ title: "À classer", num: "?", color: "#8a8f8c", items: loose });
      return out;
    }

    function render() {
      document.getElementById("tabs").innerHTML = [["quartier", "Par quartier"], ["jour", "Par jour"], ["tout", "Toutes"]]
        .map(([k, l]) => `<button type="button" data-mode="${k}" class="${mode === k ? "on" : ""}">${l}${k === "tout" ? `<small>${photos.length}</small>` : ""}</button>`).join("");
      const box = document.getElementById("gallery");
      if (!photos.length) {
        box.innerHTML = `<div class="empty">Pas encore de photos. Ajoutez-les depuis <a href="./">la carte</a>, bouton « Mon carnet » puis « + Ajouter mes photos » : elles se rangent toutes seules par quartier et apparaissent ici.<br><br>Les photos restent sur ce téléphone : ouvrez la galerie avec le même navigateur que la carte.</div>`;
        return;
      }
      const gs = mode === "tout" ? [{ title: "Toutes les photos", num: "★", color: "var(--gold)", items: photos }] : groups();
      list = gs.flatMap(g => g.items.map(p => ({ p, g })));
      let n = 0;
      box.innerHTML = gs.map(g => `<section class="grp"><h2><span class="num" style="--c:${g.color}">${g.num}</span>${g.title} <small>${g.items.length} photo${g.items.length > 1 ? "s" : ""}</small></h2>
        <div class="grid">${g.items.map(p => `<button type="button" data-i="${n++}" aria-label="Agrandir la photo"><img src="${p.url}" alt="Photo, ${g.title}" loading="lazy"></button>`).join("")}</div></section>`).join("");
    }

    function show(i) {
      if (!list.length) return;
      idx = (i + list.length) % list.length;
      const { p, g } = list[idx];
      document.getElementById("big").src = p.url;
      const d = districts.find(x => x.id === p.district);
      document.getElementById("cap").innerHTML = `<b>${d ? d.name : g.title}</b>${dayLabel(dayKey(p.t))} · ${timeLabel(p.t)}`;
      document.getElementById("count").textContent = `${idx + 1} / ${list.length}`;
      document.getElementById("viewer").classList.add("open");
    }
    const hide = () => document.getElementById("viewer").classList.remove("open");

    document.addEventListener("click", e => {
      const m = e.target.closest("[data-mode]"); if (m) { mode = m.dataset.mode; render(); return; }
      const b = e.target.closest("[data-i]"); if (b) { show(Number(b.dataset.i)); return; }
      if (e.target.closest("#close")) hide();
      else if (e.target.closest("#prev")) show(idx - 1);
      else if (e.target.closest("#next")) show(idx + 1);
      else if (e.target.id === "stage") hide();
    });
    document.addEventListener("keydown", e => {
      if (!document.getElementById("viewer").classList.contains("open")) return;
      if (e.key === "Escape") hide(); if (e.key === "ArrowLeft") show(idx - 1); if (e.key === "ArrowRight") show(idx + 1);
    });
    // Glisser du doigt pour passer d'une photo à l'autre.
    let x0 = null;
    const v = document.getElementById("viewer");
    v.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
    v.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) show(idx + (dx < 0 ? 1 : -1)); x0 = null; });

    load().then(all => {
      photos = all.map(p => ({ id: p.id, district: p.district, t: p.taken || p.date, url: URL.createObjectURL(p.blob) })).sort((a, b) => a.t - b.t);
      render();
    });
  })();
  </script>
</body>
</html>
