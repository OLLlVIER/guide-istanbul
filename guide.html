<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Istanbul · Octobre 2026 — le guide</title>
  <meta name="description" content="Le guide complet d’Istanbul au départ du Mövenpick Old Town : 14 quartiers en photos, où manger, coutumes et repères sur la Turquie.">
  <meta property="og:title" content="Istanbul · Octobre 2026 — le guide">
  <meta property="og:description" content="14 quartiers en photos, où manger, coutumes et repères sur la Turquie.">
  <link rel="stylesheet" href="leaflet.css">
  <link rel="stylesheet" href="planner.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Sans+3:wght@400;600;700;800&display=swap">
  <style>
    /* Mise en page : magazine en colonnes larges, une couleur par zone de la ville, encarts colorés. */
    :root {
      --ink: #14241d; --paper: #fbf7ef; --sand: #f3ead8; --line: rgba(20,36,29,.12);
      --muted: #55665d; --gold: #d4a24c;
      --z1: #b2452c; --z2: #2f6f9f; --z3: #7b4fa0; --z4: #1f7a72; --z5: #c07a12;
      --r3: #b2452c; --r2: #2f7a52; --r1: #8a8f8c;
      --display: "DM Serif Display", Georgia, serif;
      --body: "Source Sans 3", -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 70px; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.6 var(--body); }
    img { max-width: 100%; display: block; }
    a { color: inherit; }
    .wrap { max-width: 1180px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); }

    /* Barre de navigation */
    .nav { position: sticky; top: 0; z-index: 50; background: rgba(20,36,29,.94); backdrop-filter: blur(10px); color: white; }
    .nav .wrap { display: flex; align-items: center; gap: 22px; height: 58px; overflow-x: auto; white-space: nowrap; }
    .nav b { font-family: var(--display); font-weight: 400; font-size: 20px; margin-right: auto; }
    .nav a { text-decoration: none; font-weight: 700; font-size: 13px; opacity: .85; white-space: nowrap; }
    .nav a:hover, .nav a:focus-visible { opacity: 1; color: var(--gold); }
    .nav .map-link { background: var(--gold); color: var(--ink); padding: 7px 14px; border-radius: 999px; opacity: 1; }

    /* Ouverture */
    .hero { position: relative; min-height: 520px; display: flex; align-items: flex-end; color: white; background: #233 center / cover no-repeat; }
    .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,20,16,.15) 30%, rgba(10,20,16,.85)); }
    .hero .wrap { position: relative; z-index: 1; padding-block: 60px 48px; width: 100%; }
    .kicker { text-transform: uppercase; letter-spacing: .16em; font-size: 13px; font-weight: 800; color: var(--gold); }
    .hero h1 { margin: 8px 0 12px; font: 400 clamp(46px, 7vw, 92px)/.98 var(--display); text-wrap: balance; }
    .hero p { max-width: 640px; font-size: 20px; margin: 0; }
    .credit { position: absolute; right: 12px; bottom: 8px; z-index: 2; font-size: 11px; opacity: .7; }

    section.block { padding-block: 64px; }
    h2.title { font: 400 clamp(34px, 4.4vw, 52px)/1.05 var(--display); margin: 6px 0 14px; text-wrap: balance; }
    .lead { font-size: 20px; color: var(--muted); max-width: 760px; margin: 0 0 30px; }

    /* Le séjour */
    .days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
    .day { border-radius: 18px; padding: 18px; color: white; min-height: 200px; }
    .day:nth-child(1) { background: var(--z5); } .day:nth-child(2) { background: var(--z1); } .day:nth-child(3) { background: var(--z3); } .day:nth-child(4) { background: var(--z2); } .day:nth-child(5) { background: var(--z4); }
    .day .date { font: 400 30px/1 var(--display); }
    .day .dow { text-transform: uppercase; letter-spacing: .12em; font-size: 12px; font-weight: 800; opacity: .85; }
    .day h3 { margin: 12px 0 6px; font-size: 18px; line-height: 1.25; }
    .day p { margin: 0; font-size: 14.5px; line-height: 1.45; opacity: .95; }
    .infos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
    .info { background: white; border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; }
    .info h3 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
    .info p { margin: 0; font-size: 15.5px; }

    /* Zones et quartiers */
    .zone { padding-block: 26px 10px; }
    .zone-head { display: flex; align-items: baseline; gap: 16px; border-top: 6px solid var(--zc); padding-top: 18px; margin-bottom: 18px; flex-wrap: wrap; }
    .zone-head h2 { margin: 0; font: 400 clamp(32px, 4vw, 46px)/1 var(--display); color: var(--zc); }
    .zone-head p { margin: 0; color: var(--muted); font-size: 17px; max-width: 640px; }
    .district { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 0; background: white; border-radius: 22px; overflow: hidden; margin-bottom: 26px; box-shadow: 0 10px 30px rgba(20,36,29,.08); }
    .district .photo { position: relative; min-height: 360px; background: var(--sand) center / cover no-repeat; }
    .district .photo .num { position: absolute; left: 18px; top: 18px; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--zc); color: white; font: 400 26px/1 var(--display); }
    .district .photo .credit { color: white; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
    .district .body { padding: 28px 32px 30px; min-width: 0; }
    .district h3.name { margin: 0; font: 400 38px/1.05 var(--display); }
    .district .punch { margin: 6px 0 16px; font-size: 19px; font-weight: 700; color: var(--zc); }
    .district .story { margin: 0 0 18px; color: #34463d; font-size: 16px; }
    .zmap-wrap { margin: 26px 0 40px; display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 22px; align-items: start; }
    .zmap { height: 620px; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 30px rgba(20,40,30,.15); background: #dfe8e2; }
    .zlegend { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 12px; font-size: 14px; font-weight: 700; }
    .zlegend span { display: inline-flex; align-items: center; gap: 7px; }
    .zlegend i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
    .zlegend i.h { background: #d4a24c; }
    .zhint { margin: 6px 0 0; font-size: 13px; color: #6b7d74; }
    .zpin { overflow: visible; cursor: pointer; }
    .zpin b { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: white; font: 800 14px/1 "Source Sans 3", sans-serif; border: 3px solid white; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
    .zpin span { position: absolute; top: 37px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,.95); color: #152820; font: 700 11.5px "Source Sans 3", sans-serif; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
    .zpin.hotel b { color: #1d1608; }
    .zindex { display: grid; gap: 14px; }
    .zgroup h5 { margin: 0 0 6px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    .zgroup a { display: flex; align-items: center; gap: 9px; padding: 3px 0; color: #152820; text-decoration: none; font-weight: 700; font-size: 14.5px; }
    .zgroup a:hover { text-decoration: underline; }
    .zgroup a b { flex: 0 0 auto; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; color: white; font-size: 12.5px; }
    @media (max-width: 900px) { .zmap-wrap { grid-template-columns: 1fr; } .zindex { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 700px) { .zmap { height: 420px; } }
    .hgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin: 12px 0 24px; }
    .hcard { background: white; border-radius: 16px; padding: 16px 18px; border-top: 5px solid var(--z2); box-shadow: 0 6px 18px rgba(20,40,30,.08); display: flex; flex-direction: column; gap: 6px; }
    .hcard.local { border-top-color: var(--z5); }
    .hhead { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .hhead b { font-size: 17px; }
    .htag { flex: 0 0 auto; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--z2); }
    .hcard.local .htag { color: var(--z5); }
    .hmeta { margin: 0; font-size: 13px; font-weight: 700; color: #6b7d74; }
    .hcard p { margin: 0; font-size: 14.5px; line-height: 1.5; }
    .hcard em { margin-top: auto; padding-top: 6px; font-style: normal; font-weight: 800; color: #152820; }
    .hotelbox, .hhow { border-radius: 16px; padding: 16px 18px; margin: 16px 0; line-height: 1.55; }
    .hotelbox { background: #152820; color: #e9efe9; } .hotelbox b { color: #d4a24c; display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .12em; font-size: 12px; } .hotelbox p { margin: 0; }
    .hhow { background: #e6eef5; } .hhow.sport { background: #e5f1e6; } .hhow b { margin-right: 8px; }
    .sub2 { font-size: 22px; margin: 26px 0 4px; }
    .lead.small { font-size: 15px; margin: 0; }
    .top10 { list-style: none; margin: 18px 0 30px; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 22px; }
    .top10 li { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: white; border-radius: 16px; padding: 12px 16px; box-shadow: 0 6px 18px rgba(20,40,30,.08); }
    .tnum { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--z1); color: white; font: 400 24px/1 "DM Serif Display", serif; }
    .top10 li:nth-child(n+4) .tnum { background: var(--z2); } .top10 li:nth-child(n+7) .tnum { background: var(--z4); }
    .top10 b { display: block; font-size: 17px; } .top10 small { color: #6b7d74; font-weight: 600; }
    .tmeta { text-align: right; font-size: 13px; font-weight: 700; color: #6b7d74; } .tmeta em { font-style: normal; color: #152820; }
    .xplan { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
    .xday { background: #152820; color: #e9efe9; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
    .xday .xd { color: #d4a24c; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; font-size: 12px; }
    .xday b { font: 400 21px/1.15 "DM Serif Display", serif; color: white; } .xday p { margin: 0; font-size: 14px; line-height: 1.5; } .xday small { margin-top: auto; color: #9fb3a8; font-weight: 700; }
    @media (max-width: 1000px) { .xplan { grid-template-columns: 1fr 1fr; } .top10 { grid-template-columns: 1fr; } }
    @media (max-width: 600px) { .xplan { grid-template-columns: 1fr; } }
    .hcard.green2 { border-top-color: var(--z4); } .hcard.green2 .htag { color: var(--z4); }
    .igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin: 12px 0 24px; }
    .icard, .pcard { border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
    .icard { background: linear-gradient(135deg, #f7e3ef, #fbeee0); } .pcard { background: #e5f1e6; }
    .icard b, .pcard b { font-size: 16px; } .icard small, .pcard small { font-weight: 700; color: #6b7d74; } .icard p, .pcard p { margin: 0; font-size: 14px; line-height: 1.5; }
    .hot { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 18px 0; padding: 16px 18px; border-radius: 16px; background: linear-gradient(135deg, #2b1d3a, #4a2a4f); color: #f3e9f5; }
    .hot h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #ffb3c7; }
    .hot ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 14.5px; line-height: 1.45; }
    @media (max-width: 700px) { .hot { grid-template-columns: 1fr; } }
    .xw { font-size: 13px; font-weight: 700; color: #d6e0d9; } .xw i { font-style: normal; color: #d4a24c; }
    .lexgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
    .lex { background: white; border-radius: 16px; padding: 14px 16px; border-left: 5px solid var(--z3); display: flex; flex-direction: column; gap: 3px; box-shadow: 0 6px 18px rgba(20,40,30,.08); }
    .lex { position: relative; padding-right: 64px; }
    .say { border: 0; background: #efe7f6; color: #4a2d6b; border-radius: 999px; width: 44px; height: 44px; font-size: 20px; cursor: pointer; display: inline-grid; place-items: center; transition: transform .15s; }
    .lex .say { position: absolute; top: 50%; right: 12px; transform: translateY(-50%); }
    .say.saying { background: var(--z3); color: #fff; }
    .lex b { font: 400 22px/1.15 "DM Serif Display", serif; } .lex span { font-size: 13px; color: #6b7d74; font-weight: 700; } .lex em { font-style: normal; font-weight: 700; }
    @media (max-width: 1000px) { .lexgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .plinks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .pl { display: inline-flex; align-items: center; min-height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid rgba(21,40,32,.18); background: #fff; color: #152820; font: 700 12px/1 "Source Sans 3", sans-serif; text-decoration: none; cursor: pointer; }
    .pl.copy { background: #152820; color: #fff; border-color: #152820; }
    .ip { font-style: normal; font-weight: 800; font-size: 13px; color: #152820; margin-top: auto; padding-top: 4px; }
    .flash { background: var(--ink); color: white; border-radius: 16px; padding: 16px 18px; margin-bottom: 18px; display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: start; }
    .flash .label { grid-row: span 2; text-transform: uppercase; letter-spacing: .14em; font-size: 12px; font-weight: 800; color: var(--gold); padding-top: 4px; }
    .flash ol { margin: 0; padding-left: 22px; font-weight: 700; display: grid; gap: 4px; }
    .flash .tip { margin: 0; font-size: 14.5px; color: #d3ddd6; }
    .sights { margin: 0 0 18px; padding: 0; list-style: none; display: grid; gap: 10px; }
    .sights li { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: start; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .sights li:last-child { border-bottom: 0; }
    .rank { display: inline-grid; place-items: center; height: 24px; border-radius: 999px; color: white; font-size: 12px; font-weight: 800; }
    .rank.r3 { background: var(--r3); } .rank.r2 { background: var(--r2); } .rank.r1 { background: var(--r1); }
    .sights b { display: block; font-size: 16.5px; }
    .sights span.d { font-size: 14.5px; color: var(--muted); line-height: 1.45; }
    .sights .price { font-size: 13px; font-weight: 800; color: var(--ink); background: var(--sand); padding: 4px 9px; border-radius: 999px; white-space: nowrap; max-width: 210px; white-space: normal; text-align: center; }
    .boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .box { border-radius: 14px; padding: 14px 16px; font-size: 14.5px; line-height: 1.5; }
    .box h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; }
    .box ul { margin: 0; padding-left: 18px; }
    .box.eat { background: #fbe6dc; } .box.eat h4 { color: #94351f; }
    .box.know { background: #f7ecd2; } .box.know h4 { color: #8a5a17; }
    .box.pause { background: #e1efe8; } .box.pause h4 { color: #1f6a4c; }
    .go { margin-top: 14px; font-size: 14px; color: var(--muted); }
    .go b { color: var(--ink); }

    /* Manger */
    .food-band { background: var(--z1); color: white; }
    .food-band .lead { color: #fde8df; }
    .dishes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .dish { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 16px; padding: 16px; }
    .dish b { font: 400 22px/1.1 var(--display); display: block; margin-bottom: 4px; }
    .dish span { font-size: 14.5px; line-height: 1.45; }
    .near { margin-top: 30px; background: white; color: var(--ink); border-radius: 20px; padding: 22px 24px; }
    .near h3 { margin: 0 0 12px; font: 400 28px/1.1 var(--display); }
    .near table { width: 100%; border-collapse: collapse; font-size: 15px; }
    .near th, .near td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .near th { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
    .near td:nth-child(3), .near td:nth-child(4) { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .table-scroll { overflow-x: auto; }

    /* Règles */
    .rules { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .rule-col { border-radius: 20px; padding: 22px 24px; }
    .rule-col.do { background: #e1efe8; } .rule-col.dont { background: #f8e0d8; }
    .rule-col h3 { margin: 0 0 10px; font: 400 30px/1 var(--display); }
    .rule-col.do h3 { color: #1f6a4c; } .rule-col.dont h3 { color: #94351f; }
    .rule-col ul { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 15.5px; }

    /* Chiffres */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .stat { background: white; border-radius: 18px; padding: 18px; border-top: 6px solid var(--sc); }
    .stat .v { font: 400 34px/1.05 var(--display); color: var(--sc); }
    .stat .l { font-size: 14.5px; color: var(--muted); margin-top: 4px; }
    .politics { margin-top: 18px; background: var(--sand); border-radius: 18px; padding: 18px 22px; font-size: 15.5px; }
    .timeline { margin-top: 18px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    .timeline div { border-left: 4px solid var(--z2); padding: 4px 0 4px 12px; font-size: 14.5px; }
    .timeline b { display: block; font: 400 24px/1 var(--display); color: var(--z2); }

    /* Fin */
    .end { position: relative; color: white; background: #233 center / cover no-repeat; }
    .end::after { content: ""; position: absolute; inset: 0; background: rgba(10,20,16,.72); }
    .end .wrap { position: relative; z-index: 1; padding-block: 80px; }
    .end p { max-width: 720px; font-size: 19px; }
    .end .sign { font: italic 400 28px/1.2 var(--display); color: var(--gold); }
    footer { padding-block: 34px; font-size: 13.5px; color: var(--muted); }
    footer a { color: var(--z2); }

    :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    @media (max-width: 1000px) {
      .days { grid-template-columns: repeat(2, 1fr); } .infos, .boxes { grid-template-columns: 1fr; }
      .dishes, .stats { grid-template-columns: repeat(2, 1fr); } .timeline { grid-template-columns: repeat(2, 1fr); }
      .district { grid-template-columns: 1fr; } .district .photo { min-height: 260px; }
    }
    @media (max-width: 620px) {
      body { font-size: 16px; } .days, .dishes, .rules, .stats, .timeline { grid-template-columns: 1fr; }
      .district .body { padding: 22px 18px; } .flash { grid-template-columns: 1fr; } .flash .label { grid-row: auto; }
      .sights li { grid-template-columns: 40px 1fr; } .sights .price { grid-column: 2; justify-self: start; }
      .hero { min-height: 440px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    /* Mes photos à la fin de chaque quartier */
    .myphotos { grid-column: 1 / -1; margin: 0 clamp(18px, 3vw, 32px) 28px; padding-top: 16px; border-top: 2px dashed var(--line); }
    .myphotos h4 { margin: 0 0 10px; font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--zc, var(--ink)); }
    .mygrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .mygrid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; }
  </style>
</head>
